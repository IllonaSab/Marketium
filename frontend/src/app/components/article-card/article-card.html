<div class="article-card">
  <a [routerLink]="['/category', article.category?.slug]" class="category">
    {{ article.category?.nom }}
  </a>
  <h3>{{ article.titre }}</h3>
  <p>{{ article.extrait }}</p>
  <div class="card-footer">
    <span class="date">{{ article.date | date:'mediumDate' }}</span>
    <a [routerLink]="['/articles', article.slug]">Lire la suite →</a>
  </div>
</div>
