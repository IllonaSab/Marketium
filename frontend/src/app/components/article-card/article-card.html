<div class="article-card">
  @if (article.image?.url) {
    <img 
      [src]="'http://localhost:1337' + article.image.url" 
      [alt]="article.image.alternativeText || article.titre"
      class="card-image"
    />
  }
  <div class="card-body">
    <a [routerLink]="['/category', article.category?.slug]" class="category">
      {{ article.category?.nom }}
    </a>
    <h3>{{ article.titre }}</h3>
    <p>{{ article.extrait }}</p>
    <div class="card-footer">
      <span class="date">{{ article.date | date:'mediumDate' }}</span>
      <a [routerLink]="['/articles', article.slug]">Lire la suite →</a>
    </div>
  </div>
</div>
