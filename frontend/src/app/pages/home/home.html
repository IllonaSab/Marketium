<section class="hero">
  <h1>Bienvenue sur Marketium</h1>
  <p>Découvrez nos derniers articles sur le Lifestyle, la Food et le Luxe.</p>
  <a routerLink="/articles">Voir tous les articles</a>
</section>

<section class="latest-articles">
  <h2>Derniers articles</h2>
  <div class="articles-grid">
    @for (article of articles; track article.documentId) {
      <app-article-card [article]="article" />
    }
  </div>
</section>
