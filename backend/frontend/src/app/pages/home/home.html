<app-hero 
  title="Bienvenue sur Marketium"
  subtitle="Découvrez nos derniers articles sur le Lifestyle, la Food et le Luxe."
  buttonLabel="Voir tous les articles"
  (buttonClicked)="goToArticles()"
/>

<section class="latest-articles">
  <h2>Derniers articles</h2>
  <div class="articles-grid">
    @for (article of articles; track article.documentId) {
      <app-article-card [article]="article" />
    }
  </div>
</section>
